name: Build and deploy Flux

on:
  push:
    branches: [main]
    paths:
      - 'trigger_text.md'
      - 'trigger_imgs/**'
      - 'flux/**'
      - 'site-assets/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - '.publishing/**'
      - 'style.css'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flux-publish
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          repository: fivsevn-agy/fivsevn-spec
          ref: main
          path: .metadata-spec
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Normalize saved metadata
        run: python scripts/site_post_metadata.py normalize --site flux --root flux --schema-dir schemas
      - name: Verify publishing and saved metadata
        run: |
          python -m unittest discover -s tests -v
          python scripts/site_post_metadata.py check --site flux --root flux --schema-dir schemas
      - name: Import committed text and image uploads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ingest_github.py
      - name: Validate imported metadata
        run: python scripts/site_post_metadata.py check --site flux --root flux --schema-dir schemas
      - name: Validate authoritative shared metadata profile
        run: python .metadata-spec/tools/check_metadata.py --profile site-post-v1 --site flux --content-root flux --root . --schema .metadata-spec/content/content-metadata.schema.json
      - uses: actions/configure-pages@v5
      - name: Build the Pages artifact
        run: python scripts/build.py
      - name: Save content and upload cursors together
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::error::Main changed during generation. Rerun from the current branch head.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flux .publishing/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'publish: save Flux posts and upload cursors'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public pages and media
        run: python scripts/verify_live.py
      - name: Record verified deployment and clear matching originals
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::error::Main changed during deployment. Inbox originals are retained for the next run.'
            exit 1
          fi
          python -c 'import json; from pathlib import Path; receipt=json.loads(Path("_site/deployment.json").read_text()); Path(".publishing/deployed.sha256").write_text(receipt["site_sha256"] + "\n")'
          python scripts/image_inbox.py
          git add .publishing/deployed.sha256
          git add -u trigger_imgs
          if ! git diff --cached --quiet; then
            git commit -m 'publish: record verified Flux deployment and clear inbox'
            git push origin HEAD:main
          fi
