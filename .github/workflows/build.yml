name: Build and deploy Flux

on:
  push:
    branches: [main]
    paths:
      - 'trigger_text.md'
      - 'trigger_imgs/**'
      - 'flux/**'
      - 'site-assets/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'tests/**'
      - '.publishing/**'
      - 'style.css'
      - 'requirements.txt'
      - 'CNAME'
      - '.github/spec-ref'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      compact_image_history:
        description: Compact converted image history; resync local clones afterwards
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flux-publish
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      # Keep the Spec pin with the checked-out source and local contract copies.
      - name: Read pinned Spec revision
        id: spec_version
        shell: bash
        run: |
          spec_ref="$(cat .github/spec-ref)"
          if [[ ! "$spec_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/spec-ref must contain one full Spec commit SHA"
            exit 1
          fi
          echo "ref=$spec_ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fivsevn-agy/fivsevn-spec
          ref: ${{ steps.spec_version.outputs.ref }}
          path: .metadata-spec
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify shared contract copies
        run: |
          cmp scripts/site_post_metadata.py .metadata-spec/tools/site_post_metadata.py
          cmp scripts/media_naming.py .metadata-spec/tools/media_naming.py
          cmp schemas/content-metadata.schema.json .metadata-spec/content/content-metadata.schema.json
          cmp schemas/site-post.schema.json .metadata-spec/content/site-post.schema.json
      - name: Normalize saved metadata
        run: python scripts/site_post_metadata.py normalize --site flux --root flux --schema-dir schemas
      - name: Normalize saved content and UI images to WebP
        run: python scripts/normalize_images.py
      - name: Verify publishing and saved metadata
        run: |
          python -m unittest discover -s tests -v
          python scripts/site_post_metadata.py check --site flux --root flux --schema-dir schemas
      - name: Import committed text and image uploads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ingest_github.py
      - name: Validate imported metadata
        run: python scripts/site_post_metadata.py check --site flux --root flux --schema-dir schemas
      - name: Validate authoritative shared metadata profile
        run: python .metadata-spec/tools/check_metadata.py --profile site-post-v1 --site flux --content-root flux --root . --schema .metadata-spec/content/content-metadata.schema.json
      - name: Validate publication media and metadata
        run: |
          python scripts/media_naming.py check --site flux --root flux
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build the Pages artifact
        run: python scripts/build.py
      - name: Verify WebP source and public images
        run: python scripts/normalize_images.py --check --output _site
      - name: Save content and upload cursors together
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::error::Main changed during generation. Rerun from the current branch head.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flux site-assets style.css .publishing/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'publish: save Flux posts and upload cursors'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public pages and media
        run: python scripts/verify_live.py
      - name: Record verified deployment and clear matching originals
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::error::Main changed during deployment. Inbox originals are retained for the next run.'
            exit 1
          fi
          python -c 'import json; from pathlib import Path; receipt=json.loads(Path("_site/deployment.json").read_text()); Path(".publishing/deployed.sha256").write_text(receipt["site_sha256"] + "\n")'
          python scripts/image_inbox.py
          git add .publishing/deployed.sha256
          git add -u trigger_imgs
          if ! git diff --cached --quiet; then
            git commit -m 'publish: record verified Flux deployment and clear inbox'
            git push origin HEAD:main
          fi
      - name: Prepare verified image history cleanup
        id: media_history
        if: github.event_name == 'workflow_dispatch' && inputs.compact_image_history == true
        run: |
          python -m pip install git-filter-repo==2.47.0
          python scripts/compact_media_history.py --prepare --scope flux --repo "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/webp-history" --defer-if-pending > "$RUNNER_TEMP/webp-history-result.json"
          python - <<'PY_HISTORY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'webp-history/report.json').read_text())
          ready = report['status'] == 'prepared'
          if ready:
              assert report['protected_files_equal'] and report['cursor_ancestors_verified']
              assert report['remaining_target_paths'] == 0 and report['backup']['verified']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          print('Image history cleanup:', report['status'], report.get('reason', ''), 'paths:', report.get('filtered_path_count', 0))
          PY_HISTORY
      - name: Push compacted history without overwriting newer work
        if: steps.media_history.outputs.ready == 'true'
        run: python scripts/compact_media_history.py --push --repo "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/webp-history" --defer-if-pending
      - name: Retain the image history cleanup report
        if: always() && steps.media_history.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-history-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/webp-history/report.json
            ${{ runner.temp }}/webp-history/filtered-paths.json
            ${{ runner.temp }}/webp-history/commit-map.json
            ${{ runner.temp }}/webp-history/filter-repo.log
            ${{ runner.temp }}/webp-history/push.log
          if-no-files-found: ignore
          retention-days: 1
